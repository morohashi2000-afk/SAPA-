name: 監視設定の変更
description: 監視対象の都道府県をチェックボックスで変更します
title: "[設定変更] 監視対象の都道府県"
labels: ["settings-update"]
body:
  - type: markdown
    attributes:
      value: "チェックを入れた都道府県が自動的に `settings.json` に反映されます。"
  - type: checkboxes
    id: prefectures
    attributes:
      label: 監視対象の都道府県
      description: 監視したい都道府県を選択して「Submit new issue」を押してください。
      options:
        - label: 青森県
        - label: 岩手県
        - label: 秋田県
        - label: 宮城県
        - label: 山形県
        - label: 福島県
        - label: 新潟県
