name: SAPA通行止め 08:00本社報告

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morning-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 08:00本社報告を作成して通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python morning_report.py
