name: Disaster and Traffic Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python monitor.py
        env:
          TZ: 'Asia/Tokyo'
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add notify_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update notify_history.json" && git push)
