Name: Morning Report

on:
  schedule:
    # JST 07:50 に届かせるため、UTC 22:35（JST 07:35）に起動
    - cron: '35 22 * * *'
  workflow_dispatch:

jobs:
  morning-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 07:50:00 まで待機してから実行
        run: |
          python3 -c "
          import time
          from datetime import datetime, timezone, timedelta
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          target_time = now.replace(hour=7, minute=50, second=0, microsecond=0)
          if now < target_time:
              wait_seconds = (target_time - now).total_seconds()
              print(f'現在時刻: {now.strftime(\"%H:%M:%S\")}')
              print(f'07:50:00 まであと {wait_seconds:.1f} 秒待機します...')
              time.sleep(wait_seconds)
          print('07:50:00 になりました。朝の報告処理を実行します。')
          "

      - name: 朝の本社報告確認を実行
        run: python3 morning_report.py
